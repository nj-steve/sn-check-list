<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tesseract Local Load Test</title>
<style>
  body { font-family: monospace; padding: 20px; background: #1c1c1e; color: #fff; }
  .ok { color: #34c759; }
  .err { color: #ff3b30; }
  .info { color: #0a84ff; }
  pre { background: #2c2c2e; padding: 10px; border-radius: 8px; white-space: pre-wrap; }
  button { background: #0a84ff; color: #fff; border: 0; padding: 12px 24px; border-radius: 8px; font-size: 14px; cursor: pointer; margin: 8px 4px; }
</style>
</head>
<body>
<h2>🧪 Tesseract Local Load Test</h2>
<button onclick="run()">▶ Start Test</button>
<button onclick="location.reload()">↻ Reload</button>
<pre id="out">Click "Start Test" to run</pre>

<script src="./local-ocr.umd.js"></script>
<script>
const out = document.getElementById('out')
const log = (msg, type='info') => {
  const cls = type === 'ok' ? 'ok' : type === 'err' ? 'err' : 'info'
  out.innerHTML = `<span class="${cls}">${msg}</span>\n` + out.innerHTML
}

async function run() {
  out.innerHTML = '⏳ Testing...\n'
  try {
    log('📍 window.location.href: ' + window.location.href, 'info')
    log('📍 document.currentScript: ' + (document.currentScript && document.currentScript.src), 'info')

    // Try fetching the local files directly
    log('\n🧪 Test 1: fetch local lib/...', 'info')
    const candidates = [
      './lib/tesseract.esm.min.js',
      'lib/tesseract.esm.min.js',
      '/hybrid/html/ocr/lib/tesseract.esm.min.js',
    ]
    for (const url of candidates) {
      try {
        const r = await fetch(url)
        log(`  fetch('${url}') → ${r.status} ${r.ok ? 'OK' : 'FAIL'}`, r.ok ? 'ok' : 'err')
      } catch (e) {
        log(`  fetch('${url}') → ERROR: ${e.message}`, 'err')
      }
    }

    log('\n🧪 Test 2: infer path from document.currentScript', 'info')
    const scriptSrc = document.currentScript && document.currentScript.src
    if (scriptSrc) {
      const libUrl = new URL('lib/', scriptSrc).href
      log(`  scriptSrc: ${scriptSrc}`, 'info')
      log(`  libUrl: ${libUrl}`, 'info')
      try {
        const r = await fetch(libUrl + 'tesseract.esm.min.js')
        log(`  fetch(libUrl + ...) → ${r.status} ${r.ok ? 'OK' : 'FAIL'}`, r.ok ? 'ok' : 'err')
      } catch (e) {
        log(`  fetch error: ${e.message}`, 'err')
      }
    } else {
      log('  ❌ document.currentScript unavailable', 'err')
    }

    log('\n🧪 Test 3: load Tesseract', 'info')
    const worker = await window.SnOcr.loadTesseract()
    log('  ✅ Tesseract loaded!', 'ok')

    log('\n🧪 Test 4: simple OCR', 'info')
    const { data } = await worker.recognize('https://tessdata.projectnaptha.com/imgtest.bmp')
    log('  Result: ' + data.text.trim(), 'ok')
  } catch (e) {
    log('❌ ' + e.message, 'err')
    console.error(e)
  }
}
</script>
</body>
</html>
