<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SN OCR Test - Pure Front-End Tesseract.js</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; font-family: -apple-system, sans-serif; background: #f5f5f7; color: #1c1c1e; }
  h1 { margin: 0 0 16px; font-size: 20px; }
  .box { background: #fff; border-radius: 12px; padding: 16px; margin: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .btn { display: inline-block; background: #0a84ff; color: #fff; border: 0; padding: 12px 24px; border-radius: 10px; font-size: 15px; cursor: pointer; margin-right: 8px; }
  .btn:disabled { background: #8e8e93; }
  input[type=file] { display: none; }
  .img-wrap { text-align: center; }
  .img-wrap img { max-width: 100%; border-radius: 8px; }
  .progress { height: 6px; background: #e5e5ea; border-radius: 3px; overflow: hidden; margin: 8px 0; }
  .progress-bar { height: 100%; background: #0a84ff; transition: width .2s; }
  .log { font-family: monospace; font-size: 12px; color: #6c6c70; max-height: 200px; overflow: auto; background: #1c1c1e; color: #fff; padding: 8px; border-radius: 6px; }
  .cand { background: #f0f8ff; border: 2px solid #0a84ff; border-radius: 8px; padding: 12px; margin: 8px 0; cursor: pointer; }
  .cand-sn { font-size: 16px; font-weight: 700; font-family: monospace; }
  .cand-len { font-size: 12px; color: #6c6c70; }
  .meta { font-size: 12px; color: #8e8e93; margin-top: 4px; }
</style>
</head>
<body>
<h1>📷 SN OCR Test (pure front-end Tesseract.js)</h1>

<div class="box">
  <input type="file" id="fileInput" accept="image/*">
  <button class="btn" onclick="document.getElementById('fileInput').click()">📁 Choose Image</button>
  <button class="btn" onclick="loadSample()">📦 Load Sample</button>
  <div class="meta">Supports images of CODE128 / CODE39 / QR etc. Images with a marked red box auto-locate the box; otherwise the text region is found automatically.</div>
</div>

<div class="box" id="imgBox" style="display:none">
  <div class="img-wrap"><img id="preview" /></div>
  <div id="regionInfo" class="meta"></div>
</div>

<div class="box" id="progBox" style="display:none">
  <div id="stageText" class="meta">Preparing...</div>
  <div class="progress"><div class="progress-bar" id="progBar" style="width:0%"></div></div>
</div>

<div class="box" id="resultBox" style="display:none">
  <h3>🎯 Recognition Candidates</h3>
  <div id="candidates"></div>
  <div class="meta">Raw text: <span id="rawText"></span></div>
</div>

<div class="box">
  <h3>📋 Runtime Log</h3>
  <div class="log" id="log"></div>
</div>

<script type="module">
  const log = (m) => {
    const el = document.getElementById('log')
    el.innerHTML = m + '<br>' + el.innerHTML
    console.log(m)
  }

  let currentFile = null

  // File selection
  document.getElementById('fileInput').onchange = (e) => {
    const f = e.target.files[0]
    if (f) handleFile(f)
  }

  function handleFile(f) {
    currentFile = f
    const url = URL.createObjectURL(f)
    document.getElementById('preview').src = url
    document.getElementById('imgBox').style.display = 'block'
    log(`✅ Image selected: ${f.name} (${(f.size/1024).toFixed(1)} KB)`)
  }

  async function loadSample() {
    // Load a sample image from remote
    log('📥 Loading sample image...')
    const url = 'https://cdn.jsdelivr.net/gh/tesseract-ocr/tesseract/main/test/testing/phototest.tif'
    try {
      const resp = await fetch(url)
      const blob = await resp.blob()
      const file = new File([blob], 'sample.png', { type: 'image/png' })
      handleFile(file)
    } catch (e) {
      log('❌ Sample image failed to load: ' + e.message)
    }
  }

  // ============ OCR module (remote CDN) ============
  async function loadTesseract() {
    const TESSERACT_URL = 'https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.esm.min.js'
    const TesseractMod = await import(TESSERACT_URL)
    const Tesseract = TesseractMod.default || TesseractMod
    log('[ocr] Tesseract API: ' + Object.keys(Tesseract).slice(0, 5).join(','))
    const worker = await Tesseract.createWorker('eng', 1, {
      logger: m => log(`[tess] ${m.status} ${(m.progress*100||0).toFixed(0)}%`),
      workerPath: 'https://unpkg.com/tesseract.js@5.1.1/dist/worker.min.js',
      corePath:   'https://unpkg.com/tesseract.js-core@5.0.0',
      langPath:   'https://tessdata.projectnaptha.com/4.0.0',
      gzip:       true,
    })
    await worker.setParameters({
      tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:. ',
      tessedit_pageseg_mode: '6',  // PSM 6 single-block mode
    })
    return worker
  }

  function findRedBox(canvas) {
    const ctx = canvas.getContext('2d')
    const w = canvas.width, h = canvas.height
    const d = ctx.getImageData(0, 0, w, h).data
    let minX = w, minY = h, maxX = 0, maxY = 0, count = 0
    for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) {
      const i = (y * w + x) * 4
      if (d[i] > 180 && d[i+1] < 120 && d[i+2] < 120) {
        if (x < minX) minX = x; if (x > maxX) maxX = x
        if (y < minY) minY = y; if (y > maxY) maxY = y
        count++
      }
    }
    if (count < 100) return null
    return { x: minX - 10, y: minY - 10, w: maxX - minX + 20, h: maxY - minY + 20 }
  }

  function findTextRegion(canvas) {
    const ctx = canvas.getContext('2d')
    const w = canvas.width, h = canvas.height
    const d = ctx.getImageData(0, 0, w, h).data
    const gray = new Uint8ClampedArray(w * h)
    for (let i = 0; i < w * h; i++) {
      const j = i * 4
      gray[i] = 0.299 * d[j] + 0.587 * d[j+1] + 0.114 * d[j+2]
    }
    const rowAvg = []
    for (let y = 0; y < h; y++) {
      let s = 0; for (let x = 0; x < w; x++) s += gray[y * w + x]
      rowAvg.push(s / w)
    }
    const sorted = rowAvg.map((v, i) => ({ v, i })).sort((a, b) => a.v - b.v)
    const top = sorted.slice(0, Math.max(8, Math.floor(h * 0.1))).map(x => x.i)
    const minY = Math.min(...top), maxY = Math.max(...top)
    return { x: 0, y: minY, w, h: maxY - minY }
  }

  function preprocess(canvas, region, scale = 4) {
    const out = document.createElement('canvas')
    out.width = region.w * scale
    out.height = region.h * scale
    const ctx = out.getContext('2d')
    ctx.imageSmoothingEnabled = true
    ctx.imageSmoothingQuality = 'high'
    ctx.drawImage(canvas, region.x, region.y, region.w, region.h, 0, 0, out.width, out.height)
    const id = ctx.getImageData(0, 0, out.width, out.height)
    const d = id.data
    for (let i = 0; i < d.length; i += 4) {
      let g = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2]
      g = (g - 128) * 1.5 + 128
      g = Math.max(0, Math.min(255, g))
      d[i] = d[i+1] = d[i+2] = g
    }
    ctx.putImageData(id, 0, 0)
    return out
  }

  function parseCandidates(text, words) {
    const cands = []
    words.forEach(w => {
      const t = (w.text || '').replace(/[^A-Z0-9]/gi, '').toUpperCase()
      if (t.length >= 17) cands.push({ text: t, confidence: Math.round(w.confidence || 80) })
    })
    if (cands.length === 0) {
      const clean = text.replace(/[^A-Z0-9]/gi, '').toUpperCase()
      ;(clean.match(/[A-Z0-9]{17,}/g) || []).forEach(m => cands.push({ text: m, confidence: 70 }))
    }
    const seen = new Set()
    return cands.filter(c => !seen.has(c.text) && seen.add(c.text))
      .sort((a, b) => b.confidence - a.confidence).slice(0, 5)
  }

  // Main flow
  window.runOcr = async function() {
    if (!currentFile) { log('⚠️ Choose an image first'); return }
    document.getElementById('progBox').style.display = 'block'
    document.getElementById('resultBox').style.display = 'none'

    try {
      // 1) Load the image
      const url = URL.createObjectURL(currentFile)
      const img = new Image()
      await new Promise((r, e) => { img.onload = r; img.onerror = e; img.src = url })
      const canvas = document.createElement('canvas')
      canvas.width = img.naturalWidth
      canvas.height = img.naturalHeight
      canvas.getContext('2d').drawImage(img, 0, 0)
      log(`📐 Image size: ${canvas.width}x${canvas.height}`)

      updateProgress('Finding region', 20)
      let region = findRedBox(canvas)
      if (region) {
        log(`🔴 Red box found: x=${region.x} y=${region.y} w=${region.w} h=${region.h}`)
        document.getElementById('regionInfo').textContent = `🔴 Red box region: (${region.x},${region.y}) - ${region.w}x${region.h}`
      } else {
        region = findTextRegion(canvas)
        log(`🔍 Auto text region: x=${region.x} y=${region.y} w=${region.w} h=${region.h}`)
        document.getElementById('regionInfo').textContent = `🔍 Text region: (${region.x},${region.y}) - ${region.w}x${region.h}`
      }

      updateProgress('Preprocessing (grayscale + upscale + contrast)', 30)
      const pre = preprocess(canvas, region, 4)
      log(`✨ Preprocessed: ${canvas.width}x${canvas.height} → ${pre.width}x${pre.height}`)

      updateProgress('Loading Tesseract (~10MB on first run)', 40)
      const worker = await loadTesseract()

      updateProgress('Running OCR', 60)
      const { data } = await worker.recognize(pre)
      log(`📝 Raw: ${JSON.stringify(data.text)}`)

      updateProgress('Extracting SN', 95)
      const cands = parseCandidates(data.text, data.words || [])
      log(`🎯 Candidates: ${cands.length}`)

      // Render
      const cb = document.getElementById('candidates')
      cb.innerHTML = cands.length === 0
        ? '<div class="meta">No string of ≥ 17 chars found</div>'
        : cands.map((c, i) =>
            `<div class="cand" onclick="navigator.clipboard.writeText('${c.text}'); alert('Copied: ${c.text}')">
              <div class="cand-sn">${i+1}. ${c.text}</div>
              <div class="cand-len">${c.text.length} chars · confidence ${c.confidence}% · tap to copy</div>
            </div>`
          ).join('')
      document.getElementById('rawText').textContent = data.text.replace(/\n/g, ' | ')
      document.getElementById('resultBox').style.display = 'block'
      updateProgress('Done', 100)
    } catch (e) {
      log('❌ Error: ' + e.message)
      console.error(e)
    }
  }

  function updateProgress(stage, percent) {
    document.getElementById('stageText').textContent = `${stage} (${percent}%)`
    document.getElementById('progBar').style.width = percent + '%'
  }

  // Add a run button
  document.write('<button class="btn" style="background:#34c759;position:fixed;top:20px;right:20px" onclick="runOcr()">▶ Start Recognition</button>')
</script>
</body>
</html>
